<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoMo School Requirements Database</title>
    <link rel="stylesheet" href="./styles.css?v=2026-05-25-transparent-banner-v67" />
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar" aria-label="MoMo header">
        <div>
          <h1 class="brand-title">
            <picture class="brand-banner-wrap">
              <source media="(max-width: 640px)" srcset="./assets/momo-school-database-banner-transparent-720.png?v=2026-05-25-transparent-banner-v67" />
              <img class="brand-banner" src="./assets/momo-school-database-banner-transparent-1200.png?v=2026-05-25-transparent-banner-v67" width="1200" height="355" alt="MoMo School Requirements Database" decoding="async" fetchpriority="high" />
            </picture>
            <span class="sr-only">MoMo School Requirements Database</span>
          </h1>
        </div>
        <div class="toolbar-side">
          <div class="toolbar-actions">
            <a class="ghost-link" href="./data/schools.json?v=2026-05-25-transparent-banner-v67" target="_blank" rel="noreferrer">Data</a>
            <a class="ghost-link" href="./README.md" target="_blank" rel="noreferrer">Notes</a>
          </div>
          <p class="data-date" id="dataDate">Data date: loading</p>
        </div>
      </section>

      <section class="search-panel" aria-label="Filters">
        <div class="school-picker">
          <select id="schoolSelect" class="school-select" aria-label="Schools"></select>
        </div>
        <div class="search-box">
          <input id="searchInput" class="search-input" type="search" placeholder="School, city, state, type" autocomplete="off" aria-label="Keyword" />
        </div>
      </section>

      <section class="workspace" hidden>
        <aside class="detail" aria-label="Details">
          <div id="schoolDetail" class="detail-empty"></div>
        </aside>
      </section>
    </main>

    <script src="./app.js?v=2026-05-25-transparent-banner-v67" type="module"></script>
  </body>
</html>
