<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoMo School Requirements Database</title>
    <link rel="stylesheet" href="./styles.css?v=2026-05-25-uiuc-audit-v47" />
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar" aria-label="MoMo header">
        <div>
          <h1 class="brand-title">
            <span class="brand-highlight">MoMo</span>
            <span class="brand-subtitle">School Requirements Database</span>
          </h1>
        </div>
        <div class="toolbar-side">
          <div class="toolbar-actions">
            <a class="ghost-link" href="./data/schools.json?v=2026-05-25-uiuc-audit-v47" target="_blank" rel="noreferrer">Data</a>
            <a class="ghost-link" href="./README.md" target="_blank" rel="noreferrer">Notes</a>
          </div>
          <p class="data-date" id="dataDate">Data date: loading</p>
        </div>
      </section>

      <section class="search-panel" aria-label="Filters">
        <div class="school-picker">
          <select id="schoolSelect" class="school-select" aria-label="Schools"></select>
        </div>
        <div class="search-box">
          <input id="searchInput" class="search-input" type="search" placeholder="School, city, state, type" autocomplete="off" aria-label="Keyword" />
        </div>
      </section>

      <section class="workspace">
        <aside class="detail" aria-label="Details">
          <div id="schoolDetail" class="detail-empty">
            <h2>Select a school</h2>
            <p>Application portal, audition requirements, repertoire, deadlines, English scores, fees, and official sources will appear here.</p>
          </div>
        </aside>
      </section>
    </main>

    <script src="./app.js?v=2026-05-25-uiuc-audit-v47" type="module"></script>
  </body>
</html>
